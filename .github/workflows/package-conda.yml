name: conda package testing for hfradarpy

on: [push]

jobs:
  test:
    name: pytest (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform finish, so one failure does not hide the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]
    defaults:
      run:
        # Login shell, so the conda environment is active in every step
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v4
    # macos-latest runners no longer ship with conda: install Miniforge and create the environment
    - name: Set up conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        environment-file: environment_dev.yml
        activate-environment: hfradarpy
        python-version: ${{ matrix.python-version }}
        conda-remove-defaults: "true"
    - name: Install hfradarpy
      run: python -m pip install --no-deps -e .
    - name: Show environment
      run: conda list
    - name: Test with pytest
      run: pytest
